[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-udp-discovery-client"
version = "0.0.0"
description = "Client library for discovering django-udp-discovery servers on LAN"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}

[project.optional-dependencies]
network = [
    "netifaces>=0.11.0",
    "ifaddr>=0.2.0",
]

[project.urls]
repository = "https://github.com/Ogro-Projukti/django-udp-discovery-client"

[tool.setuptools]
packages = ["discovery_client", "discovery_client.network"]

